<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل الثاني – الحركة في بعد واحد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#F7F1E6;--panel:#FFFDF8;--ink:#3A2A1E;--muted:#6E5D4E;--line:#E5D7C0;--acc:#B5552F;--onacc:#fff;--acc2:#6B7A2E;--chip:#F3EADB;--ok:#4F7A2A;--okbg:#EAF2DD;--bad:#B03A2E;--badbg:#F8E1DD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="badge" id="badge"></span></div>
<h1 id="h1"></h1>
<nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="pre" id="t1"></button><button role="tab" aria-selected="false" data-p="poe" id="t3"></button><button role="tab" aria-selected="false" data-p="post" id="t2"></button></nav>
<section class="pane on" id="pre"><p class="hint" id="h_pre"></p><div class="card" id="pc"></div><div class="nav"><button id="pp"></button><div class="dots" id="pd"></div><button id="pn"></button></div></section>
<section class="pane" id="poe"><p class="hint" id="h_poe"></p><div class="card" id="ec"></div><div class="nav"><button id="ep"></button><div class="dots" id="ed"></div><button id="en"></button></div></section>
<section class="pane" id="post"><p class="hint" id="h_post"></p><div class="card" id="dc"></div><div class="nav"><button id="dp"></button><div class="dots" id="dd"></div><button id="dn"></button></div></section>
</div>
<script>
const D={"lang":"ar","course":"فيزياء عامة 1","code":"2031204-4","title":"قبل المعمل وبعده: <span>الفصل الثاني – الحركة في بعد واحد</span>","review":"محاضرة الفصل الثاني: الإزاحة والمسافة، السرعة المتوسطة واللحظية، معادلات التسارع الثابت، السقوط الحر.","pre":[{"q":"جسم موضعه <span class=\"eq\" dir=\"ltr\">x = 2t<sup>2</sup> − 4t</span> (بالمتر). سرعته اللحظية عند <span class=\"eq\" dir=\"ltr\">t = 2.5 s</span>:","o":["<span class=\"eq\" dir=\"ltr\">1 m/s</span>","<span class=\"eq\" dir=\"ltr\">2.5 m/s</span>","<span class=\"eq\" dir=\"ltr\">6 m/s</span>","<span class=\"eq\" dir=\"ltr\">10 m/s</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">v = dx/dt = 4t − 4 = 4(2.5) − 4 = 6 m/s</span>."},{"q":"سيارة سرعتها الابتدائية <span class=\"eq\" dir=\"ltr\">5 m/s</span> وتسارعها <span class=\"eq\" dir=\"ltr\">2 m/s<sup>2</sup></span>. سرعتها بعد <span class=\"eq\" dir=\"ltr\">5 s</span>:","o":["<span class=\"eq\" dir=\"ltr\">10 m/s</span>","<span class=\"eq\" dir=\"ltr\">15 m/s</span>","<span class=\"eq\" dir=\"ltr\">25 m/s</span>","<span class=\"eq\" dir=\"ltr\">50 m/s</span>"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">v = v<sub>i</sub> + at = 5 + 2(5) = 15 m/s</span>."},{"q":"المسافة التي تقطعها السيارة نفسها خلال تلك الثواني الخمس:","o":["<span class=\"eq\" dir=\"ltr\">25 m</span>","<span class=\"eq\" dir=\"ltr\">37.5 m</span>","<span class=\"eq\" dir=\"ltr\">50 m</span>","<span class=\"eq\" dir=\"ltr\">75 m</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">Δx = v<sub>i</sub>t + ½at<sup>2</sup> = 25 + 25 = 50 m</span>."},{"q":"كرة قُذفت رأسيًا إلى أعلى. عند أقصى ارتفاع تكون:","o":["السرعة صفرًا والتسارع صفرًا","السرعة صفرًا والتسارع g إلى أسفل","السرعة عظمى والتسارع صفرًا","السرعة صفرًا والتسارع g إلى أعلى"],"a":1,"e":"تسارع الجاذبية ثابت طوال الحركة، والسرعة تنعدم لحظيًا فقط عند القمة."},{"q":"جسم يبدأ عند x = <span class=\"eq\" dir=\"ltr\">30 m</span> ويصل إلى <span class=\"eq\" dir=\"ltr\">52 m</span> ثم يعود إلى x = <span class=\"eq\" dir=\"ltr\">−53 m</span>. إزاحته الكلية:","o":["<span class=\"eq\" dir=\"ltr\">−83 m</span>","<span class=\"eq\" dir=\"ltr\">−23 m</span>","<span class=\"eq\" dir=\"ltr\">83 m</span>","<span class=\"eq\" dir=\"ltr\">127 m</span>"],"a":0,"e":"<span class=\"eq\" dir=\"ltr\">Δx = x<sub>f</sub> − x<sub>i</sub> = −53 − 30 = −83 m</span>، أما المسافة فهي <span class=\"eq\" dir=\"ltr\">22 + 105 = 127 m</span>."}],"post":[{"t":"التجربة 1: الإزاحة والمسافة","q":"لحركة استغرقت <span class=\"eq\" dir=\"ltr\">50 s</span> من <span class=\"eq\" dir=\"ltr\">30 m</span> إلى <span class=\"eq\" dir=\"ltr\">52 m</span> ثم إلى <span class=\"eq\" dir=\"ltr\">−53 m</span>: احسب السرعة المتوسطة القياسية والمتجهة. ومتى تتساويان في المقدار؟","a":"المسافة <span class=\"eq\" dir=\"ltr\">127 m</span> فالسرعة القياسية <span class=\"eq\" dir=\"ltr\">127/50 ≈ 2.54 m/s</span>، والإزاحة <span class=\"eq\" dir=\"ltr\">−83 m</span> فالسرعة المتجهة <span class=\"eq\" dir=\"ltr\">−1.66 m/s</span>. وتتساويان في المقدار فقط إذا تحرك الجسم في اتجاه واحد دون أن يعود."},{"t":"التجربة 2: السرعة اللحظية","q":"صغّرت Δt تدريجيًا. إلى أي قيمة يقترب ميل الخط القاطع؟ وماذا يمثل؟","a":"يقترب من ميل المماس عند <span class=\"eq\" dir=\"ltr\">t<sub>0</sub></span>، أي السرعة اللحظية <span class=\"eq\" dir=\"ltr\">v = dx/dt</span>. للمعادلة الافتراضية <span class=\"eq\" dir=\"ltr\">x = 2t<sup>2</sup> − 4t + c</span> يقترب الميل من <span class=\"eq\" dir=\"ltr\">6 m/s</span> عند <span class=\"eq\" dir=\"ltr\">t<sub>0</sub> = 2.5 s</span>."},{"t":"التجربة 3: التسارع الثابت","q":"اجعل vi موجبة وa سالبة (مثلًا <span class=\"eq\" dir=\"ltr\">5 m/s</span> و−<span class=\"eq\" dir=\"ltr\">2 m/s²</span>). متى تتوقف السيارة لحظيًا؟ وأين؟","a":"تتوقف عندما <span class=\"eq\" dir=\"ltr\">v = 0</span>: <span class=\"eq\" dir=\"ltr\">t = −v<sub>i</sub>/a = 2.5 s</span>، بعد أن تقطع <span class=\"eq\" dir=\"ltr\">Δx = v<sub>i</sub><sup>2</sup>/(2|a|) = 6.25 m</span>، ثم تبدأ بالحركة في الاتجاه المعاكس إذا استمر التسارع."},{"t":"التجربة 4: السقوط الحر","q":"حجر قُذف إلى أعلى بسرعة <span class=\"eq\" dir=\"ltr\">20 m/s</span> من سطح مبنى ارتفاعه <span class=\"eq\" dir=\"ltr\">50 m</span>. ما سرعته عندما يعود إلى مستوى السطح؟ وما أقصى ارتفاع يبلغه فوق السطح؟","a":"يعود بالسرعة نفسها <span class=\"eq\" dir=\"ltr\">20 m/s</span> لكن إلى أسفل، لتماثل الحركة صعودًا وهبوطًا. وأقصى ارتفاع <span class=\"eq\" dir=\"ltr\">v<sub>0</sub><sup>2</sup>/(2g) = 400/19.6 ≈ 20.4 m</span> فوق السطح، بعد <span class=\"eq\" dir=\"ltr\">≈ 2.04 s</span>."}],"poe":[{"t":"التجربة 1: الإزاحة والمسافة","q":"جسم يبدأ من <span class=\"eq\" dir=\"ltr\">x = 0</span>، يذهب إلى <span class=\"eq\" dir=\"ltr\">50 m</span> ثم يعود إلى <span class=\"eq\" dir=\"ltr\">0</span> في <span class=\"eq\" dir=\"ltr\">50 s</span>. سرعته المتجهة المتوسطة:","o":["<span class=\"eq\" dir=\"ltr\">2 m/s</span>","<span class=\"eq\" dir=\"ltr\">1 m/s</span>","صفر","<span class=\"eq\" dir=\"ltr\">−2 m/s</span>"],"a":2,"do":"في تبويب «الإزاحة والمسافة» اجعل <span class=\"eq\" dir=\"ltr\">x<sub>i</sub> = 0</span> ونقطة الانعطاف <span class=\"eq\" dir=\"ltr\">50 m</span> و<span class=\"eq\" dir=\"ltr\">x<sub>f</sub> = 0</span> و<span class=\"eq\" dir=\"ltr\">Δt = 50 s</span>، ثم شغّل.","e":"الإزاحة صفر فالسرعة المتجهة المتوسطة صفر، أما السرعة القياسية المتوسطة فهي <span class=\"eq\" dir=\"ltr\">100 m / 50 s = 2 m/s</span>. تتساويان فقط إذا لم يغيّر الجسم اتجاهه."},{"t":"التجربة 2: السرعة اللحظية","q":"إذا كان <span class=\"eq\" dir=\"ltr\">x = 2t<sup>2</sup> − 4t</span> فإن ميل القاطع عند <span class=\"eq\" dir=\"ltr\">t<sub>0</sub> = 2.5 s</span> يقترب، عند تصغير <span class=\"eq\" dir=\"ltr\">Δt</span>، من:","o":["<span class=\"eq\" dir=\"ltr\">2.5 m/s</span>","<span class=\"eq\" dir=\"ltr\">6 m/s</span>","<span class=\"eq\" dir=\"ltr\">7 m/s</span>","<span class=\"eq\" dir=\"ltr\">2.5 m</span>"],"a":1,"do":"في تبويب «السرعة اللحظية» اجعل <span class=\"eq\" dir=\"ltr\">a = 2</span> و<span class=\"eq\" dir=\"ltr\">b = −4</span> و<span class=\"eq\" dir=\"ltr\">t<sub>0</sub> = 2.5</span>، ثم صغّر <span class=\"eq\" dir=\"ltr\">Δt</span> من <span class=\"eq\" dir=\"ltr\">1</span> إلى <span class=\"eq\" dir=\"ltr\">0.01</span>.","e":"<span class=\"eq\" dir=\"ltr\">v = dx/dt = 4t − 4 = 6 m/s</span> عند <span class=\"eq\" dir=\"ltr\">t = 2.5 s</span>. القاطع يصبح مماسًا عندما <span class=\"eq\" dir=\"ltr\">Δt → 0</span>، وميل المماس هو السرعة اللحظية."},{"t":"التجربة 3: التسارع الثابت","q":"سيارة <span class=\"eq\" dir=\"ltr\">v<sub>i</sub> = 10 m/s</span> وتسارعها <span class=\"eq\" dir=\"ltr\">a = −2 m/s<sup>2</sup></span>. متى تعود إلى نقطة البداية؟","o":["<span class=\"eq\" dir=\"ltr\">5 s</span>","<span class=\"eq\" dir=\"ltr\">10 s</span>","<span class=\"eq\" dir=\"ltr\">20 s</span>","لا تعود أبدًا"],"a":1,"do":"في تبويب «التسارع الثابت» اجعل <span class=\"eq\" dir=\"ltr\">v<sub>i</sub> = 10</span> و<span class=\"eq\" dir=\"ltr\">a = −2</span>، وحرّك الزمن وراقب الموضع.","e":"تتوقف لحظيًا عند <span class=\"eq\" dir=\"ltr\">t = v<sub>i</sub>/|a| = 5 s</span>، ثم ترجع. <span class=\"eq\" dir=\"ltr\">x = 10t − t<sup>2</sup> = 0</span> عند <span class=\"eq\" dir=\"ltr\">t = 10 s</span>. التوقف اللحظي لا يعني أن التسارع صفر."},{"t":"التجربة 4: السقوط الحر","q":"قُذف حجر لأعلى بسرعة <span class=\"eq\" dir=\"ltr\">20 m/s</span> من سطح مبنى. سرعته عندما يعود إلى مستوى السطح:","o":["صفر","<span class=\"eq\" dir=\"ltr\">10 m/s</span>","<span class=\"eq\" dir=\"ltr\">20 m/s</span> لأسفل","<span class=\"eq\" dir=\"ltr\">40 m/s</span> لأسفل"],"a":2,"do":"في تبويب «السقوط الحر» اجعل <span class=\"eq\" dir=\"ltr\">v<sub>0</sub> = 20</span>، وحرّك الزمن إلى لحظة العودة إلى مستوى السطح (نحو <span class=\"eq\" dir=\"ltr\">4.1 s</span>).","e":"الحركة متماثلة: يصعد <span class=\"eq\" dir=\"ltr\">2.04 s</span> وينزل <span class=\"eq\" dir=\"ltr\">2.04 s</span>، فيعود بالمقدار نفسه <span class=\"eq\" dir=\"ltr\">20 m/s</span> لكن باتجاه معاكس، بإهمال مقاومة الهواء."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t3:'2) Predict & try',t2:'3) Post-lab discussion',hpoe:'During the lab: predict first, try it in the lab, then read the explanation.',s1:'① Predict',s2:'② Try it in the lab',s3:'③ Explain',see:'I tried it, show explanation',hit:'Your prediction was right.',miss:'Your prediction differs from the result, which is useful: see why.',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};

$('badge').innerHTML=D.course+' · <bdi dir="ltr">'+D.code+'</bdi>';$('h1').innerHTML=D.title;
$('t1').textContent=T.t1;$('t2').textContent=T.t2;$('t3').textContent=T.t3;$('h_poe').textContent=T.hpoe;$('h_pre').textContent=T.hpre;$('h_post').textContent=T.hpost;
['pp','dp','ep'].forEach(i=>$(i).textContent=T.prev);['pn','dn','en'].forEach(i=>$(i).textContent=T.next);
let pi=0,st=D.pre.map(()=>-1),di=0,shown=D.post.map(()=>false),txt=D.post.map(()=>'');

else{const it=D.pre[pi];c.innerHTML='<div class="qn">'+T.q+' '+(pi+1)+' '+T.of+' '+N+'</div><div class="q">'+it.q+'</div>';
