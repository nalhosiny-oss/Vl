<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل الخامس – الديناميكا الحرارية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#F7F1E6;--panel:#FFFDF8;--ink:#3A2A1E;--muted:#6E5D4E;--line:#E5D7C0;--acc:#B5552F;--onacc:#fff;--acc2:#6B7A2E;--chip:#F3EADB;--ok:#4F7A2A;--okbg:#EAF2DD;--bad:#B03A2E;--badbg:#F8E1DD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="badge" id="badge"></span></div>
<h1 id="h1"></h1>
<nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="pre" id="t1"></button><button role="tab" aria-selected="false" data-p="poe" id="t3"></button><button role="tab" aria-selected="false" data-p="post" id="t2"></button></nav>
<section class="pane on" id="pre"><p class="hint" id="h_pre"></p><div class="card" id="pc"></div><div class="nav"><button id="pp"></button><div class="dots" id="pd"></div><button id="pn"></button></div></section>
<section class="pane" id="poe"><p class="hint" id="h_poe"></p><div class="card" id="ec"></div><div class="nav"><button id="ep"></button><div class="dots" id="ed"></div><button id="en"></button></div></section>
<section class="pane" id="post"><p class="hint" id="h_post"></p><div class="card" id="dc"></div><div class="nav"><button id="dp"></button><div class="dots" id="dd"></div><button id="dn"></button></div></section>
</div>
<script>
const D={"lang":"ar","course":"فيزياء عامة 1","code":"2031204-4","title":"قبل المعمل وبعده: <span>الفصل الخامس – الديناميكا الحرارية</span>","review":"محاضرة الفصل الخامس: مقاييس الحرارة، التمدد الحراري، المسعر، الحرارة الكامنة، القانون الأول.","pre":[{"q":"درجة الحرارة التي يتساوى عندها مقياسا سيليزيوس وفهرنهايت:","o":["<span class=\"eq\" dir=\"ltr\">0°</span>","<span class=\"eq\" dir=\"ltr\">−32°</span>","<span class=\"eq\" dir=\"ltr\">−40°</span>","<span class=\"eq\" dir=\"ltr\">100°</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">T<sub>F</sub> = 1.8T<sub>C</sub> + 32 = T<sub>C</sub> ⇒ T = −40</span>."},{"q":"درجة الحرارة 25.00 °C تساوي بالكلفن:","o":["<span class=\"eq\" dir=\"ltr\">248.15 K</span>","<span class=\"eq\" dir=\"ltr\">273.15 K</span>","<span class=\"eq\" dir=\"ltr\">298.15 K</span>","<span class=\"eq\" dir=\"ltr\">310.15 K</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">T<sub>K</sub> = T<sub>C</sub> + 273.15</span>."},{"q":"قضيب ألومنيوم طوله <span class=\"eq\" dir=\"ltr\">2.00 m</span> و<span class=\"eq\" dir=\"ltr\">α = 24×10<sup>−6</sup> °C<sup>−1</sup></span> يُسخن من 20 °C إلى 100 °C. الزيادة في طوله:","o":["<span class=\"eq\" dir=\"ltr\">0.384 mm</span>","<span class=\"eq\" dir=\"ltr\">1.92 mm</span>","<span class=\"eq\" dir=\"ltr\">3.84 mm</span>","<span class=\"eq\" dir=\"ltr\">38.4 mm</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">ΔL = αL<sub>i</sub>ΔT = 24×10<sup>−6</sup> × 2 × 80 = 3.84×10<sup>−3</sup> m</span>."},{"q":"أي المرحلتين تحتاج طاقة أكبر لكتلة الماء نفسها:","o":["انصهار الجليد","تبخر الماء","متساويتان","تسخين الماء من 0 °C إلى 100 °C"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">L<sub>v</sub> ≈ 2.26×10<sup>6</sup> J/kg</span> أكبر بنحو سبع مرات من <span class=\"eq\" dir=\"ltr\">L<sub>f</sub> ≈ 3.33×10<sup>5</sup> J/kg</span>."},{"q":"غاز يتمدد دون أن يمتص حرارة (Q = 0). طاقته الداخلية:","o":["تزداد","تقل","لا تتغير","تصبح صفرًا"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">ΔE<sub>int</sub> = Q + W</span> والشغل المبذول على الغاز سالب عند التمدد، فتقل الطاقة الداخلية وتنخفض درجة الحرارة."}],"post":[{"t":"التجربة 1: المقاييس","q":"استنتج درجة الحرارة التي يتساوى عندها مقياسا سيليزيوس وفهرنهايت، ثم حوّل 25 °C إلى الفهرنهايت والكلفن.","a":"نضع <span class=\"eq\" dir=\"ltr\">T<sub>F</sub> = T<sub>C</sub> = T</span> في <span class=\"eq\" dir=\"ltr\">T<sub>F</sub> = 1.8T<sub>C</sub> + 32</span> فنحصل على <span class=\"eq\" dir=\"ltr\">−0.8T = 32 ⇒ T = −40°</span>. و<span class=\"eq\" dir=\"ltr\">25 °C = 77 °F = 298.15 K</span>."},{"t":"التجربة 2: التمدد الحراري","q":"لماذا تُترك فواصل بين قضبان السكك الحديدية؟ استخدم نتيجة المعمل لقضيب <span class=\"eq\" dir=\"ltr\">2 m</span>.","a":"لأن القضبان تتمدد عند ارتفاع الحرارة، وقضيب <span class=\"eq\" dir=\"ltr\">2 m</span> من الألومنيوم يزيد طوله <span class=\"eq\" dir=\"ltr\">3.84 mm</span> عند ارتفاع 80 °C (والحديد <span class=\"eq\" dir=\"ltr\">α ≈ 11×10<sup>−6</sup></span> نحو نصف ذلك). وبدون فواصل تتولد إجهادات كبيرة تُلوي السكة."},{"t":"التجربة 3: المسعر","q":"في المثال: معدن 0.050 kg عند 100 °C يُلقى في 0.200 kg ماء عند 20 °C، فتستقر الحرارة عند 22.4 °C. احسب cx.","a":"الحرارة المفقودة = المكتسبة: <span class=\"eq\" dir=\"ltr\">c<sub>x</sub> = m<sub>w</sub>c<sub>w</sub>(T<sub>f</sub> − T<sub>w</sub>) / [m<sub>x</sub>(T<sub>x</sub> − T<sub>f</sub>)] = (0.2 × 4186 × 2.4)/(0.05 × 77.6) ≈ 518 J/kg·°C</span>، وهي قيمة قريبة من الحرارة النوعية للجرمانيوم."},{"t":"التجربتان 4 و5: الحرارة الكامنة والقانون الأول","q":"غاز يمتص <span class=\"eq\" dir=\"ltr\">500 J</span> ويتمدد عند ضغط ثابت <span class=\"eq\" dir=\"ltr\">1.20×10<sup>5</sup> Pa</span> بمقدار <span class=\"eq\" dir=\"ltr\">2.0×10<sup>−3</sup> m<sup>3</sup></span>. احسب التغير في طاقته الداخلية.","a":"الشغل المبذول على الغاز <span class=\"eq\" dir=\"ltr\">W = −PΔV = −240 J</span>، فـ<span class=\"eq\" dir=\"ltr\">ΔE<sub>int</sub> = Q + W = 500 − 240 = 260 J</span>. أي أن جزءًا من الحرارة الممتصة تحول إلى شغل بذله الغاز على المحيط والباقي رفع طاقته الداخلية."}],"poe":[{"t":"التجربة 1: المقاييس","q":"عند أي درجة يتساوى مقياسا سيليزيوس وفهرنهايت؟","o":["<span class=\"eq\" dir=\"ltr\">0°</span>","<span class=\"eq\" dir=\"ltr\">−40°</span>","<span class=\"eq\" dir=\"ltr\">32°</span>","<span class=\"eq\" dir=\"ltr\">−32°</span>"],"a":1,"do":"في تبويب «المقاييس» حرّك المنزلق ببطء نحو القيم السالبة حتى يتساوى المقياسان.","e":"<span class=\"eq\" dir=\"ltr\">T<sub>F</sub> = 1.8T<sub>C</sub> + 32</span>، فالتساوي يعطي <span class=\"eq\" dir=\"ltr\">T = 1.8T + 32</span>، أي <span class=\"eq\" dir=\"ltr\">T = −40</span>."},{"t":"التجربة 2: التمدد الحراري","q":"قضيب فولاذ <span class=\"eq\" dir=\"ltr\">α = 11×10<sup>−6</sup> °C<sup>−1</sup></span> طوله <span class=\"eq\" dir=\"ltr\">10 m</span> يُسخَّن من <span class=\"eq\" dir=\"ltr\">20 °C</span> إلى <span class=\"eq\" dir=\"ltr\">100 °C</span>. الزيادة في طوله تقريبًا:","o":["<span class=\"eq\" dir=\"ltr\">0.88 mm</span>","<span class=\"eq\" dir=\"ltr\">8.8 mm</span>","<span class=\"eq\" dir=\"ltr\">88 mm</span>","<span class=\"eq\" dir=\"ltr\">0.088 mm</span>"],"a":1,"do":"في تبويب «التمدد الحراري» اجعل <span class=\"eq\" dir=\"ltr\">α = 11</span> و<span class=\"eq\" dir=\"ltr\">L<sub>i</sub> = 10</span> و<span class=\"eq\" dir=\"ltr\">T<sub>i</sub> = 20</span> و<span class=\"eq\" dir=\"ltr\">T<sub>f</sub> = 100</span>، واقرأ <span class=\"eq\" dir=\"ltr\">ΔL</span>.","e":"<span class=\"eq\" dir=\"ltr\">ΔL = αL<sub>i</sub>ΔT = 11×10<sup>−6</sup> × 10 × 80 ≈ 8.8×10<sup>−3</sup> m</span>. مليمترات قليلة، لكنها كافية لتشويه قضبان السكك لولا الفواصل."},{"t":"التجربة 3: المسعر","q":"في المسعر، إذا ضاعفت كتلة المعدن الساخن مع بقاء كل شيء آخر، فإن درجة الاتزان <span class=\"eq\" dir=\"ltr\">T<sub>f</sub></span>:","o":["تقل","ترتفع، لكن الارتفاع فوق <span class=\"eq\" dir=\"ltr\">T<sub>w</sub></span> لا يتضاعف تمامًا","يتضاعف ارتفاعها فوق <span class=\"eq\" dir=\"ltr\">T<sub>w</sub></span> تمامًا","لا تتغير"],"a":1,"do":"في تبويب «المسعر» اقرأ <span class=\"eq\" dir=\"ltr\">T<sub>f</sub></span>، ثم ضاعف <span class=\"eq\" dir=\"ltr\">m<sub>x</sub></span> وقارن الارتفاع فوق درجة الماء.","e":"<span class=\"eq\" dir=\"ltr\">m<sub>x</sub>c<sub>x</sub>(T<sub>x</sub> − T<sub>f</sub>) = m<sub>w</sub>c<sub>w</sub>(T<sub>f</sub> − T<sub>w</sub>)</span>. المعدن الأكبر يعطي حرارة أكثر فترتفع <span class=\"eq\" dir=\"ltr\">T<sub>f</sub></span>، لكن ارتفاعها يقلل الحرارة المعطاة، فلا يتضاعف الارتفاع تمامًا."},{"t":"التجربة 4: الحرارة الكامنة","q":"عند تسخين الجليد حتى يصير بخارًا، أي جزء أفقي في المنحنى هو الأطول؟","o":["الانصهار","التبخر","هما متساويان","لا توجد أجزاء أفقية"],"a":1,"do":"في تبويب «الحرارة الكامنة» اجعل <span class=\"eq\" dir=\"ltr\">m = 0.10 kg</span>، وحرّك الطاقة المضافة <span class=\"eq\" dir=\"ltr\">Q</span> على مداها، وقارن طولي الجزأين الأفقيين.","e":"<span class=\"eq\" dir=\"ltr\">L<sub>f</sub> ≈ 334 kJ/kg</span> و<span class=\"eq\" dir=\"ltr\">L<sub>v</sub> ≈ 2260 kJ/kg</span>، فالتبخر يحتاج نحو سبعة أمثال طاقة الانصهار، لأنه يفصل الجزيئات فصلًا كاملًا. ودرجة الحرارة ثابتة في الجزأين."},{"t":"التجربة 5: القانون الأول","q":"غاز يتمدد (<span class=\"eq\" dir=\"ltr\">ΔV > 0</span>) دون أن يمتص حرارة (<span class=\"eq\" dir=\"ltr\">Q = 0</span>). طاقته الداخلية:","o":["تزيد","تقل","لا تتغير","تصبح صفرًا"],"a":1,"do":"في تبويب «القانون الأول» اجعل <span class=\"eq\" dir=\"ltr\">Q = 0</span> و<span class=\"eq\" dir=\"ltr\">ΔV</span> موجبًا، واقرأ <span class=\"eq\" dir=\"ltr\">ΔE<sub>int</sub></span>.","e":"الشغل المبذول على الغاز <span class=\"eq\" dir=\"ltr\">W = −PΔV</span> سالب، و<span class=\"eq\" dir=\"ltr\">ΔE<sub>int</sub> = Q + W < 0</span>. الغاز يبذل شغلًا من طاقته الداخلية فيبرد، وهذا ما يحدث في التمدد الكظيم."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t3:'2) Predict & try',t2:'3) Post-lab discussion',hpoe:'During the lab: predict first, try it in the lab, then read the explanation.',s1:'① Predict',s2:'② Try it in the lab',s3:'③ Explain',see:'I tried it, show explanation',hit:'Your prediction was right.',miss:'Your prediction differs from the result, which is useful: see why.',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};

$('badge').innerHTML=D.course+' · <bdi dir="ltr">'+D.code+'</bdi>';$('h1').innerHTML=D.title;
