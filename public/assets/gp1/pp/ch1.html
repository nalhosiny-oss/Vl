<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل الأول – المتجهات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#F7F1E6;--panel:#FFFDF8;--ink:#3A2A1E;--muted:#6E5D4E;--line:#E5D7C0;--acc:#B5552F;--onacc:#fff;--acc2:#6B7A2E;--chip:#F3EADB;--ok:#4F7A2A;--okbg:#EAF2DD;--bad:#B03A2E;--badbg:#F8E1DD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="badge" id="badge"></span></div>
<h1 id="h1"></h1>
<nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="pre" id="t1"></button><button role="tab" aria-selected="false" data-p="poe" id="t3"></button><button role="tab" aria-selected="false" data-p="post" id="t2"></button></nav>
<section class="pane on" id="pre"><p class="hint" id="h_pre"></p><div class="card" id="pc"></div><div class="nav"><button id="pp"></button><div class="dots" id="pd"></div><button id="pn"></button></div></section>
<section class="pane" id="poe"><p class="hint" id="h_poe"></p><div class="card" id="ec"></div><div class="nav"><button id="ep"></button><div class="dots" id="ed"></div><button id="en"></button></div></section>
<section class="pane" id="post"><p class="hint" id="h_post"></p><div class="card" id="dc"></div><div class="nav"><button id="dp"></button><div class="dots" id="dd"></div><button id="dn"></button></div></section>
</div>
<script>
const D={"lang":"ar","course":"فيزياء عامة 1","code":"2031204-4","title":"قبل المعمل وبعده: <span>الفصل الأول – المتجهات</span>","review":"محاضرة الفصل الأول: الإحداثيات القطبية، جمع المتجهات بالرسم وبالمركبات، ضرب المتجه في عدد.","pre":[{"q":"نقطة إحداثياتها <span class=\"eq\" dir=\"ltr\">(−3.50, −2.50) m</span>. زاويتها القطبية المقيسة من محور x الموجب تساوي تقريبًا:","o":["<span class=\"eq\" dir=\"ltr\">35.5°</span>","<span class=\"eq\" dir=\"ltr\">144.5°</span>","<span class=\"eq\" dir=\"ltr\">215.5°</span>","<span class=\"eq\" dir=\"ltr\">324.5°</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">tan<sup>−1</sup>(2.5/3.5) = 35.5°</span>، والنقطة في الربع الثالث فنضيف <span class=\"eq\" dir=\"ltr\">180°</span>."},{"q":"تكون المركبة الأفقية Ax للمتجه سالبة عندما تكون زاويته θ (من محور x الموجب):","o":["بين <span class=\"eq\" dir=\"ltr\">0°</span> و<span class=\"eq\" dir=\"ltr\">90°</span>","بين <span class=\"eq\" dir=\"ltr\">90°</span> و<span class=\"eq\" dir=\"ltr\">270°</span>","بين <span class=\"eq\" dir=\"ltr\">180°</span> و<span class=\"eq\" dir=\"ltr\">360°</span>","أكبر من <span class=\"eq\" dir=\"ltr\">270°</span> فقط"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">A<sub>x</sub> = A cos θ</span>، وجيب التمام سالب في الربعين الثاني والثالث."},{"q":"<span class=\"eq\" dir=\"ltr\">A = 2î + 2ĵ</span> و<span class=\"eq\" dir=\"ltr\">B = 2î − 4ĵ</span>. مقدار المحصلة <span class=\"eq\" dir=\"ltr\">R = A + B</span>:","o":["<span class=\"eq\" dir=\"ltr\">2.0</span>","<span class=\"eq\" dir=\"ltr\">4.0</span>","<span class=\"eq\" dir=\"ltr\">4.47</span>","<span class=\"eq\" dir=\"ltr\">6.0</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">R = 4î − 2ĵ</span>، فمقدارها <span class=\"eq\" dir=\"ltr\">√(16 + 4) = √20 ≈ 4.47</span>."},{"q":"إذا بدأنا بالمتجه B ثم أضفنا A بدل العكس، فإن المحصلة:","o":["تتغير في المقدار فقط","تتغير في الاتجاه فقط","لا تتغير","تنعكس"],"a":2,"e":"جمع المتجهات تبديلي: <span class=\"eq\" dir=\"ltr\">A + B = B + A</span>."},{"q":"ما قيمة العدد m التي تجعل mA متجهًا معاكسًا لـ A بنصف طوله؟","o":["<span class=\"eq\" dir=\"ltr\">0.5</span>","<span class=\"eq\" dir=\"ltr\">−0.5</span>","<span class=\"eq\" dir=\"ltr\">−2</span>","<span class=\"eq\" dir=\"ltr\">2</span>"],"a":1,"e":"الإشارة السالبة تعكس الاتجاه، والقيمة المطلقة 0.5 تنصّف الطول."}],"post":[{"t":"التجربة 1: الإحداثيات القطبية","q":"متى نضيف <span class=\"eq\" dir=\"ltr\">180°</span> إلى الزاوية التي تعطيها الآلة الحاسبة عند حساب θ من tan⁻¹(y/x)؟ طبّق على النقطة (−3.50, −2.50).","a":"عندما تكون x سالبة (الربعان الثاني والثالث)، لأن الآلة الحاسبة تعطي tan⁻¹ بين <span class=\"eq\" dir=\"ltr\">−90°</span> و<span class=\"eq\" dir=\"ltr\">90°</span> فقط. للنقطة المعطاة: <span class=\"eq\" dir=\"ltr\">r = √(3.5<sup>2</sup> + 2.5<sup>2</sup>) ≈ 4.30 m</span> و<span class=\"eq\" dir=\"ltr\">θ = 35.5° + 180° = 215.5°</span>."},{"t":"التجربة 2: الجمع بالرسم","q":"سيارة تقطع <span class=\"eq\" dir=\"ltr\">20 km</span> شمالًا ثم <span class=\"eq\" dir=\"ltr\">35 km</span> في اتجاه <span class=\"eq\" dir=\"ltr\">150°</span> من الشرق. هل تتغير المحصلة إذا بدأت بالمتجه B؟ وما مقدارها؟","a":"لا تتغير لأن الجمع تبديلي. وبالمركبات: <span class=\"eq\" dir=\"ltr\">R<sub>x</sub> = 35 cos150° = −30.3 km</span> و<span class=\"eq\" dir=\"ltr\">R<sub>y</sub> = 20 + 35 sin150° = 37.5 km</span>، فيكون <span class=\"eq\" dir=\"ltr\">R ≈ 48.2 km</span> باتجاه نحو <span class=\"eq\" dir=\"ltr\">38.9°</span> غرب الشمال."},{"t":"التجربتان 3 و4: المركبات والجمع بالمركبات","q":"متجه مقداره 5.0 يصنع <span class=\"eq\" dir=\"ltr\">30°</span> مع محور x. أوجد مركبتيه، ثم وضّح لماذا يُفضَّل الجمع بالمركبات على الرسم.","a":"<span class=\"eq\" dir=\"ltr\">A<sub>x</sub> = 5 cos30° = 4.33</span> و<span class=\"eq\" dir=\"ltr\">A<sub>y</sub> = 5 sin30° = 2.50</span>. والجمع بالمركبات يحوّل الجمع الاتجاهي إلى جمع جبري لكل محور، فيعطي نتيجة دقيقة لأي عدد من المتجهات دون أخطاء الرسم والقياس."},{"t":"التجربة 5: الضرب في عدد","q":"اجعل B = −A. ماذا تكون المحصلة؟ وما أثر ضرب المتجه في عدد سالب؟","a":"المحصلة صفر (المتجه الصفري). وضرب المتجه في عدد سالب يعكس اتجاهه ويضرب طوله في القيمة المطلقة للعدد."}],"poe":[{"t":"التجربة 1: الإحداثيات القطبية","q":"النقطة <span class=\"eq\" dir=\"ltr\">(x, y) = (−3, −4) m</span>. زاويتها مقيسةً من محور <span class=\"eq\" dir=\"ltr\">+x</span> عكس عقارب الساعة:","o":["<span class=\"eq\" dir=\"ltr\">53.1°</span>","<span class=\"eq\" dir=\"ltr\">233.1°</span>","<span class=\"eq\" dir=\"ltr\">126.9°</span>","<span class=\"eq\" dir=\"ltr\">−53.1°</span>"],"a":1,"do":"في تبويب «الإحداثيات القطبية» اجعل <span class=\"eq\" dir=\"ltr\">x = −3</span> و<span class=\"eq\" dir=\"ltr\">y = −4</span>، واقرأ <span class=\"eq\" dir=\"ltr\">r</span> والزاوية.","e":"<span class=\"eq\" dir=\"ltr\">r = 5 m</span>. الآلة الحاسبة تعطي <span class=\"eq\" dir=\"ltr\">tan<sup>−1</sup>(4/3) = 53.1°</span>، لكن النقطة في الربع الثالث فنضيف <span class=\"eq\" dir=\"ltr\">180°</span> لتصبح <span class=\"eq\" dir=\"ltr\">233.1°</span>."},{"t":"التجربة 2: الجمع بالرسم","q":"<span class=\"eq\" dir=\"ltr\">A = 30</span> نحو الشرق (<span class=\"eq\" dir=\"ltr\">0°</span>) و<span class=\"eq\" dir=\"ltr\">B = 40</span> نحو الشمال (<span class=\"eq\" dir=\"ltr\">90°</span>). مقدار المحصلة <span class=\"eq\" dir=\"ltr\">R</span>:","o":["<span class=\"eq\" dir=\"ltr\">70</span>","<span class=\"eq\" dir=\"ltr\">50</span>","<span class=\"eq\" dir=\"ltr\">10</span>","<span class=\"eq\" dir=\"ltr\">35</span>"],"a":1,"do":"في تبويب «الجمع بالرسم» اجعل <span class=\"eq\" dir=\"ltr\">A = 30</span> باتجاه <span class=\"eq\" dir=\"ltr\">0°</span> و<span class=\"eq\" dir=\"ltr\">B = 40</span> باتجاه <span class=\"eq\" dir=\"ltr\">90°</span>، واقرأ <span class=\"eq\" dir=\"ltr\">R</span>.","e":"المتجهان متعامدان، فـ <span class=\"eq\" dir=\"ltr\">R = √(30<sup>2</sup> + 40<sup>2</sup>) = 50</span>. نجمع المقادير جمعًا عاديًا فقط إذا كان المتجهان في الاتجاه نفسه. وتبديل الترتيب لا يغيّر <span class=\"eq\" dir=\"ltr\">R</span>."},{"t":"التجربة 3: المركبات","q":"متجه مقداره <span class=\"eq\" dir=\"ltr\">10</span> وزاويته <span class=\"eq\" dir=\"ltr\">120°</span>. إشارة المركّبتين <span class=\"eq\" dir=\"ltr\">A<sub>x</sub></span> و<span class=\"eq\" dir=\"ltr\">A<sub>y</sub></span>:","o":["كلتاهما موجبة","<span class=\"eq\" dir=\"ltr\">A<sub>x</sub></span> سالبة و<span class=\"eq\" dir=\"ltr\">A<sub>y</sub></span> موجبة","<span class=\"eq\" dir=\"ltr\">A<sub>x</sub></span> موجبة و<span class=\"eq\" dir=\"ltr\">A<sub>y</sub></span> سالبة","كلتاهما سالبة"],"a":1,"do":"في تبويب «المركبات» اجعل المقدار <span class=\"eq\" dir=\"ltr\">10</span> والزاوية <span class=\"eq\" dir=\"ltr\">120°</span>، واقرأ المركّبتين.","e":"<span class=\"eq\" dir=\"ltr\">A<sub>x</sub> = 10 cos 120° = −5</span> و<span class=\"eq\" dir=\"ltr\">A<sub>y</sub> = 10 sin 120° ≈ 8.66</span>. تكون <span class=\"eq\" dir=\"ltr\">A<sub>x</sub></span> سالبة بين <span class=\"eq\" dir=\"ltr\">90°</span> و<span class=\"eq\" dir=\"ltr\">270°</span>، وتنعدم <span class=\"eq\" dir=\"ltr\">A<sub>y</sub></span> عند <span class=\"eq\" dir=\"ltr\">0°</span> و<span class=\"eq\" dir=\"ltr\">180°</span>."},{"t":"التجربة 4: الجمع بالمركبات","q":"إذا كان <span class=\"eq\" dir=\"ltr\">A = (3, −2)</span> و<span class=\"eq\" dir=\"ltr\">B = (−3, 2)</span> فإن المحصلة <span class=\"eq\" dir=\"ltr\">R = A + B</span>:","o":["<span class=\"eq\" dir=\"ltr\">(6, −4)</span>","المتجه الصفري","<span class=\"eq\" dir=\"ltr\">(0, −4)</span>","<span class=\"eq\" dir=\"ltr\">(3, 2)</span>"],"a":1,"do":"في تبويب «الجمع بالمركبات» اضبط المركّبات الأربع، وراقب المحصلة على الرسم.","e":"<span class=\"eq\" dir=\"ltr\">B = −A</span>، فتنعدم كل مركّبة: <span class=\"eq\" dir=\"ltr\">R<sub>x</sub> = 0</span> و<span class=\"eq\" dir=\"ltr\">R<sub>y</sub> = 0</span>. المتجه وسالبه لهما المقدار نفسه واتجاهان متعاكسان."},{"t":"التجربة 5: الضرب في عدد","q":"ما قيمة <span class=\"eq\" dir=\"ltr\">m</span> التي تجعل <span class=\"eq\" dir=\"ltr\">mA</span> معاكسًا لـ <span class=\"eq\" dir=\"ltr\">A</span> بنصف طوله؟","o":["<span class=\"eq\" dir=\"ltr\">0.5</span>","<span class=\"eq\" dir=\"ltr\">−2</span>","<span class=\"eq\" dir=\"ltr\">−0.5</span>","<span class=\"eq\" dir=\"ltr\">2</span>"],"a":2,"do":"في تبويب «الضرب في عدد» حرّك <span class=\"eq\" dir=\"ltr\">m</span> إلى <span class=\"eq\" dir=\"ltr\">−0.5</span> وقارن المتجهين.","e":"الإشارة السالبة تعكس الاتجاه، والمقدار <span class=\"eq\" dir=\"ltr\">|m| = 0.5</span> ينصّف الطول. أما <span class=\"eq\" dir=\"ltr\">m = −2</span> فيعكس الاتجاه ويضاعف الطول."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t3:'2) Predict & try',t2:'3) Post-lab discussion',hpoe:'During the lab: predict first, try it in the lab, then read the explanation.',s1:'① Predict',s2:'② Try it in the lab',s3:'③ Explain',see:'I tried it, show explanation',hit:'Your prediction was right.',miss:'Your prediction differs from the result, which is useful: see why.',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};
const $=id=>document.getElementById(id);
$('badge').innerHTML=D.course+' · <bdi dir="ltr">'+D.code+'</bdi>';$('h1').innerHTML=D.title;
$('t1').textContent=T.t1;$('t2').textContent=T.t2;$('t3').textContent=T.t3;$('h_poe').textContent=T.hpoe;$('h_pre').textContent=T.hpre;$('h_post').textContent=T.hpost;
['pp','dp','ep'].forEach(i=>$(i).textContent=T.prev);['pn','dn','en'].forEach(i=>$(i).textContent=T.next);
let pi=0,st=D.pre.map(()=>-1),di=0,shown=D.post.map(()=>false),txt=D.post.map(()=>'');
function dots(el,n,k){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i===k)d.className='on';el.appendChild(d);}}
function rPre(){const c=$('pc');const N=D.pre.length;
if(pi===N){const s=st.filter((v,i)=>v===D.pre[i].a).length;c.innerHTML='<div class="score"><div>'+T.res+'</div><div class="big">'+s+' / '+N+'</div><p>'+(s>=N-1?T.good:(s>=Math.ceil(N/2)?T.mid:T.low+D.review))+'</p><button class="show" id="rt">'+T.again+'</button></div>';$('rt').onclick=()=>{st=st.map(()=>-1);pi=0;rPre();};}
else{const it=D.pre[pi];c.innerHTML='<div class="qn">'+T.q+' '+(pi+1)+' '+T.of+' '+N+'</div><div class="q">'+it.q+'</div>';
it.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;
if(st[pi]>=0){b.disabled=true;if(j===it.a)b.classList.add('right');else if(j===st[pi])b.classList.add('wrong');}
b.onclick=()=>{st[pi]=j;rPre();};c.appendChild(b);});
if(st[pi]>=0){const f=document.createElement('div');f.className='fb';f.innerHTML='<b>'+(st[pi]===it.a?T.ok:T.no)+'</b> '+it.e;c.appendChild(f);}}
dots($('pd'),N+1,pi);$('pp').disabled=pi===0;$('pn').disabled=pi===N||(pi<N&&st[pi]<0);}
function rPost(){const c=$('dc');const N=D.post.length;const it=D.post[di];
c.innerHTML='<div class="qn">'+T.q+' '+(di+1)+' '+T.of+' '+N+'<span class="tag">'+it.t+'</span></div><div class="q">'+it.q+'</div><textarea placeholder="'+T.ph+'"></textarea><button class="show">'+(shown[di]?T.hide:T.show)+'</button><div class="ans'+(shown[di]?' on':'')+'">'+it.a+'</div>';
