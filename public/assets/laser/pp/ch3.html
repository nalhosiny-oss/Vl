<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل الثالث – مستويات الطاقة والانتقالات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#140B0D;--panel:#1E1215;--ink:#F3ECE6;--muted:#BCA9A4;--line:#3A2428;--acc:#C8323F;--onacc:#fff;--acc2:#E2B54C;--chip:#2A181C;--ok:#3FB37F;--okbg:rgba(63,179,127,.16);--bad:#E2525E;--badbg:rgba(226,82,94,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>

<script>
const D={"lang":"ar","course":"فيزياء الليزر وتطبيقاتها","code":"2034203-4","title":"قبل المعمل وبعده: <span>الفصل الثالث – مستويات الطاقة والانتقالات</span>","review":"محاضرة الفصل الثالث: توزيع بولتزمان، معاملات آينشتين، الانبعاث التلقائي والمستحث، التشبع.","pre":[{"q":"في الاتزان الحراري وعند أي درجة حرارة موجبة، تعداد المستوى الأعلى N<sub>2</sub> مقارنةً بالأدنى N<sub>1</sub>:","o":["أكبر دائمًا","أصغر دائمًا","يساويه دائمًا","أكبر عند درجات الحرارة المنخفضة"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">N<sub>2</sub>/N<sub>1</sub> = e<sup>−ΔE/kT</sup> &lt; 1</span> لأي درجة حرارة موجبة، ويقترب من 1 فقط عندما <span class=\"eq\" dir=\"ltr\">T → ∞</span>. لذلك يحتاج الانعكاس السكاني إلى ضخ خارجي."},{"q":"فرق الطاقة بين مستويين يُصدر الانتقال بينهما ضوءًا أخضر طوله <span class=\"eq\" dir=\"ltr\">532 nm</span> يساوي تقريبًا:","o":["<span class=\"eq\" dir=\"ltr\">1.96 eV</span>","<span class=\"eq\" dir=\"ltr\">2.33 eV</span>","<span class=\"eq\" dir=\"ltr\">2.75 eV</span>","<span class=\"eq\" dir=\"ltr\">3.10 eV</span>"],"a":1,"e":"<span class=\"eq\" dir=\"ltr\">E = 1240 / λ(nm) = 1240 / 532 ≈ 2.33 eV</span>."},{"q":"الفوتون الناتج من الانبعاث المستحث مقارنةً بالفوتون الساقط:","o":["له التردد نفسه فقط","له الاتجاه نفسه فقط","مطابق له في التردد والطور والاتجاه والاستقطاب","يختلف عنه في كل شيء"],"a":2,"e":"الفوتون المستحث نسخة مطابقة للفوتون الساقط، وهذا أصل ترابط ضوء الليزر وأحاديته واتجاهيته."},{"q":"لماذا يصعب بناء ليزر يعمل في نطاق الأشعة السينية؟","o":["لأن الأشعة السينية لا تنعكس أبدًا","لأن الانبعاث التلقائي يطغى على المستحث بشدة عند الترددات العالية","لأن طاقة فوتوناتها صغيرة","لأن معامل آينشتين B يصبح صفرًا"],"a":1,"e":"نسبة التلقائي إلى المستحث <span class=\"eq\" dir=\"ltr\">A/(Bρ) = e<sup>hν/kT</sup> − 1</span> تزداد بسرعة مع التردد، كما أن <span class=\"eq\" dir=\"ltr\">A ∝ ν<sup>3</sup></span>، فيفرغ المستوى الأعلى قبل أن يحدث التكبير."},{"q":"شدة التشبع <span class=\"eq\" dir=\"ltr\">I<sub>s</sub> = hν / (στ)</span>. إذا ضاعفنا عمر الانحلال τ فإن I<sub>s</sub>:","o":["تتضاعف","لا تتغير","تقل إلى النصف","تقل إلى الربع"],"a":2,"e":"تتناسب شدة التشبع عكسيًا مع عمر الانحلال، فالمستوى الذي يعيش طويلًا يتشبع بشدة أقل."}],"post":[{"t":"التجربة 1: توزيع بولتزمان","q":"احسب <span class=\"eq\" dir=\"ltr\">N<sub>2</sub>/N<sub>1</sub></span> عند <span class=\"eq\" dir=\"ltr\">ΔE = 0.05 eV</span> و<span class=\"eq\" dir=\"ltr\">T = 300 K</span>، ثم بيّن هل يمكن الوصول إلى انعكاس سكاني برفع درجة الحرارة فقط.","a":"<span class=\"eq\" dir=\"ltr\">kT ≈ 0.0259 eV</span>، فتكون <span class=\"eq\" dir=\"ltr\">N<sub>2</sub>/N<sub>1</sub> = e<sup>−0.05/0.0259</sup> ≈ e<sup>−1.93</sup> ≈ 0.145</span>. ورفع الحرارة يقرّب النسبة من 1 دون أن تتجاوزها، فلا يتحقق الانعكاس السكاني بالتسخين، بل يحتاج ضخًا ينقل الذرات إلى المستوى الأعلى."},{"t":"التجربة 3: التلقائي مقابل المستحث","q":"عند أي تردد تقريبًا يتساوى الانبعاثان عند <span class=\"eq\" dir=\"ltr\">300 K</span>؟ وماذا تستنتج عن الليزرات في المناطق الطيفية المختلفة؟","a":"يتساويان عندما <span class=\"eq\" dir=\"ltr\">e<sup>hν/kT</sup> − 1 = 1</span>، أي <span class=\"eq\" dir=\"ltr\">hν = kT ln 2</span>، فيكون <span class=\"eq\" dir=\"ltr\">ν ≈ (0.693 × 0.0259 eV) / (4.14×10<sup>−15</sup> eV·s) ≈ 4×10<sup>12</sup> Hz</span> في الأشعة تحت الحمراء البعيدة. وفي المرئي وما بعده يطغى التلقائي كثيرًا في الاتزان، فلا بد من انعكاس سكاني وضخ قوي، وتزداد الصعوبة كلما ارتفع التردد."},{"t":"التجربة 4: التشبع","q":"ماذا يحدث لشدة التشبع عند مضاعفة τ؟ ولماذا تُستخدم مواد ممتصة سريعة الاستعادة (τ قصير) في تبديل عامل النوعية؟","a":"تقل شدة التشبع إلى النصف لأن <span class=\"eq\" dir=\"ltr\">I<sub>s</sub> ∝ 1/τ</span>. والممتص القابل للتشبع في تبديل عامل النوعية يجب أن يُبيَّض (يصبح شفافًا) أثناء النبضة ثم يستعيد امتصاصه بسرعة ليغلق المرنان من جديد، فالعمر القصير يسمح بنبضات قصيرة ومتكررة، ويُختار له مقطع عرضي σ كبير ليبقى I<sub>s</sub> منخفضًا."},{"t":"التجربة 5: إشعاع الجسم الأسود","q":"لماذا يبدو المصباح المتوهج مائلًا للأحمر رغم أن ذروة إشعاعه ليست في المرئي؟","a":"بقانون فين <span class=\"eq\" dir=\"ltr\">λ<sub>max</sub> = 2.898×10<sup>−3</sup> / T</span>، وعند <span class=\"eq\" dir=\"ltr\">T ≈ 2800 K</span> تكون الذروة قرب <span class=\"eq\" dir=\"ltr\">1 μm</span> في تحت الحمراء. وداخل المدى المرئي يكون الجزء الأحمر أقرب إلى الذروة، فشدته أكبر من الأزرق، فيميل لون المصباح إلى الأحمر والبرتقالي."}],"poe":[{"t":"التجربة 1: توزيع بولتزمان","q":"عند <span class=\"eq\" dir=\"ltr\">300 K</span> وفرق طاقة <span class=\"eq\" dir=\"ltr\">ΔE = 0.05 eV</span> تكون النسبة <span class=\"eq\" dir=\"ltr\">N<sub>1</sub>/N<sub>0</sub> ≈ 0.14</span>. إذا ضاعفت ΔE إلى <span class=\"eq\" dir=\"ltr\">0.10 eV</span> فإن النسبة تصبح تقريبًا:","o":["<span class=\"eq\" dir=\"ltr\">0.07</span> (النصف)","<span class=\"eq\" dir=\"ltr\">0.02</span> (مربع القيمة السابقة)","<span class=\"eq\" dir=\"ltr\">0.28</span> (الضعف)","<span class=\"eq\" dir=\"ltr\">0.14</span> (لا تتغير)"],"a":1,"do":"في تبويب «توزيع بولتزمان» ابدأ من القيم الأولى (<span class=\"eq\" dir=\"ltr\">0.050 eV</span> و<span class=\"eq\" dir=\"ltr\">300 K</span>)، ثم حرّك منزلق فرق الطاقة إلى <span class=\"eq\" dir=\"ltr\">0.100</span>، واقرأ <span class=\"eq\" dir=\"ltr\">N<sub>1</sub>/N<sub>0</sub></span>.","e":"<span class=\"eq\" dir=\"ltr\">N<sub>1</sub>/N<sub>0</sub> = e<sup>−ΔE/kT</sup></span>، فمضاعفة ΔE تعني تربيع النسبة: <span class=\"eq\" dir=\"ltr\">0.14² ≈ 0.02</span>. العلاقة أسية لا خطية."},{"t":"التجربة 2: الفوتون والانتقالات","q":"الانتقال الحالي <span class=\"eq\" dir=\"ltr\">ΔE = 1.96 eV</span> يعطي ضوءًا أحمر <span class=\"eq\" dir=\"ltr\">(633 nm)</span>. إذا خفضت ΔE إلى <span class=\"eq\" dir=\"ltr\">1.0 eV</span> فإن الفوتون الناتج يكون:","o":["أزرق","أخضر","أحمر أفتح","تحت الأحمر، غير مرئي"],"a":3,"do":"في تبويب «الفوتون والانتقالات» حرّك منزلق فرق الطاقة إلى <span class=\"eq\" dir=\"ltr\">1.00 eV</span>، واقرأ الطول الموجي ونطاقه.","e":"<span class=\"eq\" dir=\"ltr\">λ = hc/ΔE ≈ 1240/ΔE nm</span>، فيكون <span class=\"eq\" dir=\"ltr\">λ ≈ 1240 nm</span> في الأشعة تحت الحمراء. الطاقة الأقل تعني طولًا موجيًا أطول."},{"t":"التجربة 3: التلقائي مقابل المستحث","q":"عند <span class=\"eq\" dir=\"ltr\">ν = 6×10<sup>14</sup> Hz</span> (ضوء مرئي) يغلب الانبعاث التلقائي بفارق هائل عند <span class=\"eq\" dir=\"ltr\">300 K</span>. إذا رفعت الحرارة إلى <span class=\"eq\" dir=\"ltr\">10000 K</span>:","o":["يغلب الانبعاث المستحث","يتساويان تمامًا","يبقى التلقائي غالبًا لكن الفارق يصغر كثيرًا","يختفي الانبعاث التلقائي"],"a":2,"do":"في تبويب «التلقائي مقابل المستحث» اضبط التردد <span class=\"eq\" dir=\"ltr\">6.0×10<sup>14</sup> Hz</span>، ثم ارفع درجة الحرارة إلى <span class=\"eq\" dir=\"ltr\">10000 K</span>، واقرأ النسبة.","e":"<span class=\"eq\" dir=\"ltr\">A<sub>21</sub>/(B<sub>21</sub>ρ) = e<sup>hν/kT</sup> − 1</span>. عند <span class=\"eq\" dir=\"ltr\">10000 K</span> تكون <span class=\"eq\" dir=\"ltr\">hν/kT ≈ 2.9</span> والنسبة نحو 17، فالتلقائي ما زال أكبر. لذلك لا يكفي التسخين لصنع ليزر في المرئي، بل نحتاج انعكاسًا سكانيًا."},{"t":"التجربة 4: التشبع","q":"إذا كانت شدة الإشعاع تسعة أضعاف شدة التشبع <span class=\"eq\" dir=\"ltr\">(I = 9I<sub>s</sub>)</span>، فإن الانعكاس السكاني <span class=\"eq\" dir=\"ltr\">ΔN/ΔN<sub>0</sub></span> يصبح:","o":["<span class=\"eq\" dir=\"ltr\">0.9</span>","<span class=\"eq\" dir=\"ltr\">0.5</span>","<span class=\"eq\" dir=\"ltr\">0.1</span>","<span class=\"eq\" dir=\"ltr\">0</span>"],"a":2,"do":"في تبويب «التشبع» حرّك منزلق <span class=\"eq\" dir=\"ltr\">I/I<sub>s</sub></span> إلى نحو <span class=\"eq\" dir=\"ltr\">9</span>، واقرأ <span class=\"eq\" dir=\"ltr\">ΔN/ΔN<sub>0</sub></span>.","e":"<span class=\"eq\" dir=\"ltr\">ΔN/ΔN<sub>0</sub> = 1/(1 + I/I<sub>s</sub>) = 1/10</span>. الشدة العالية تستهلك الانعكاس السكاني فيقل الكسب، وهذا ما يحدد القدرة القصوى لليزر."},{"t":"التجربة 5: إشعاع الجسم الأسود","q":"عند <span class=\"eq\" dir=\"ltr\">5800 K</span> (سطح الشمس) تقع ذروة الإشعاع عند نحو <span class=\"eq\" dir=\"ltr\">500 nm</span>. إذا خفضت الحرارة إلى النصف <span class=\"eq\" dir=\"ltr\">(2900 K)</span> فإن الذروة:","o":["تبقى عند 500 nm","تنتقل إلى نحو 250 nm","تنتقل إلى نحو 1000 nm","تختفي"],"a":2,"do":"في تبويب «إشعاع الجسم الأسود» حرّك منزلق درجة الحرارة إلى <span class=\"eq\" dir=\"ltr\">2900 K</span>، واقرأ <span class=\"eq\" dir=\"ltr\">λ<sub>max</sub></span>.","e":"قانون فين <span class=\"eq\" dir=\"ltr\">λ<sub>max</sub> = b/T</span>: نصف الحرارة يعني ضعف الطول الموجي، أي نحو <span class=\"eq\" dir=\"ltr\">1000 nm</span> في تحت الأحمر، ولهذا يُشع المصباح المتوهج معظم طاقته حرارةً."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t2:'2) Post-lab discussion',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};

$('t1').textContent=T.t1;$('t2').textContent=T.t2;$('t3').textContent=T.t3;$('h_poe').textContent=T.hpoe;$('h_pre').textContent=T.hpre;$('h_post').textContent=T.hpost;
['pp','dp','ep'].forEach(i=>$(i).textContent=T.prev);['pn','dn','en'].forEach(i=>$(i).textContent=T.next);

else{const it=D.pre[pi];c.innerHTML='<div class="qn">'+T.q+' '+(pi+1)+' '+T.of+' '+N+'</div><div class="q">'+it.q+'</div>';
