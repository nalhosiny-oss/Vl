<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل السابع – جريان الموائع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#F5F6F4;--panel:#FFFFFF;--ink:#22303D;--muted:#5D6873;--line:#DADFE3;--acc:#3D4B5C;--onacc:#fff;--acc2:#1F7FA3;--chip:#E9EDF0;--ok:#2E7D4F;--okbg:#E3F1E8;--bad:#B03A2E;--badbg:#F8E1DD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="badge" id="badge"></span></div>
<h1 id="h1"></h1>
<nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="pre" id="t1"></button><button role="tab" aria-selected="false" data-p="poe" id="t3"></button><button role="tab" aria-selected="false" data-p="post" id="t2"></button></nav>
<section class="pane on" id="pre"><p class="hint" id="h_pre"></p><div class="card" id="pc"></div><div class="nav"><button id="pp"></button><div class="dots" id="pd"></div><button id="pn"></button></div></section>
<section class="pane" id="poe"><p class="hint" id="h_poe"></p><div class="card" id="ec"></div><div class="nav"><button id="ep"></button><div class="dots" id="ed"></div><button id="en"></button></div></section>
<section class="pane" id="post"><p class="hint" id="h_post"></p><div class="card" id="dc"></div><div class="nav"><button id="dp"></button><div class="dots" id="dd"></div><button id="dn"></button></div></section>
</div>
<script>
const D={"lang": "ar", "course": "الفيزياء العامة (2)", "code": "2033002-4", "title": "قبل المعمل وبعده: <span>الفصل السابع – جريان الموائع</span>", "review": "محاضرة الفصل السابع: المائع المثالي، ومعادلة الاستمرارية، ومعدل التدفق، ومعادلة برنولي وتطبيقاتها، وقانون بوازيه.", "pre": [{"q": "من صفات المائع المثالي أنه:", "o": ["لزج وقابل للانضغاط", "غير لزج وغير قابل للانضغاط وسريانه مستقر", "يتغير ضغطه مع الزمن", "دوّامي الحركة"], "a": 1, "e": "المائع المثالي غير لزج وغير قابل للانضغاط، وسريانه مستقر وغير دوّامي."}, {"q": "يضيق أنبوب ماء من قطر <span class=\"eq\" dir=\"ltr\">4 cm</span> إلى <span class=\"eq\" dir=\"ltr\">2 cm</span>. سرعة الماء في الجزء الضيق تصبح:", "o": ["نصف السرعة", "ضعف السرعة", "أربعة أمثال السرعة", "ثماني مرات"], "a": 2, "e": "<span class=\"eq\" dir=\"ltr\">A₁v₁ = A₂v₂</span> والمساحة تتناسب مع مربع القطر، فتصبح السرعة أربعة أمثالها."}, {"q": "حسب معادلة برنولي، في الجزء الذي تزداد فيه سرعة المائع على المستوى نفسه:", "o": ["يزداد الضغط", "يقل الضغط", "لا يتغير الضغط", "تزداد الكثافة"], "a": 1, "e": "<span class=\"eq\" dir=\"ltr\">P + ½ρv<sup>2</sup> + ρgh</span> ثابت، فزيادة v تعني نقص P."}, {"q": "إذا ضوعف نصف قطر أنبوب مع ثبات بقية العوامل، فإن معدل التدفق اللزج حسب قانون بوازيه:", "o": ["يتضاعف", "يصبح أربعة أمثاله", "يصبح 8 أمثاله", "يصبح 16 مثلًا"], "a": 3, "e": "<span class=\"eq\" dir=\"ltr\">Q = πR<sup>4</sup>ΔP/(8ηL)</span>، و<span class=\"eq\" dir=\"ltr\">2<sup>4</sup> = 16</span>."}], "post": [{"t": "تفسير", "q": "لماذا تُرفع الأسقف الخفيفة أحيانًا أثناء العواصف الشديدة؟", "a": "سرعة الهواء فوق السقف كبيرة، فيقل الضغط فوقه حسب برنولي، بينما يبقى الضغط تحته قرب الضغط الجوي، فتنشأ قوة صافية لأعلى."}, {"t": "حساب", "q": "خزان مفتوح فيه ماء بارتفاع <span class=\"eq\" dir=\"ltr\">2.0 m</span>، وثقب صغير على ارتفاع <span class=\"eq\" dir=\"ltr\">0.5 m</span> من القاع. احسب سرعة خروج الماء.", "a": "<span class=\"eq\" dir=\"ltr\">v = √(2g(H − y)) = √(2 × 9.8 × 1.5) ≈ 5.4 m/s</span>."}, {"t": "ربط", "q": "لماذا يسبب تضيّق بسيط في الشريان انخفاضًا كبيرًا في تدفق الدم؟", "a": "حسب قانون بوازيه يتناسب التدفق مع <span class=\"eq\" dir=\"ltr\">R<sup>4</sup></span>؛ فنقص نصف القطر 20% مثلًا يقلل التدفق إلى نحو <span class=\"eq\" dir=\"ltr\">0.8<sup>4</sup> ≈ 41%</span> عند فرق الضغط نفسه."}], "poe": [{"t": "برنولي", "q": "عند تصغير d₂، ارتفاع الماء في الأنبوب الرأسي فوق الاختناق:", "o": ["يرتفع", "ينخفض", "لا يتغير"], "a": 1, "do": "في تبويب «الاستمرارية وبرنولي» صغّر d₂ تدريجيًا وراقب عمود P₂.", "e": "تزداد السرعة في الاختناق فيقل الضغط، فينخفض عمود الماء فوقه."}, {"t": "تورشيللي", "q": "مع ثبات H، أبعد مسافة يصل إليها الماء عندما يكون الثقب:", "o": ["قرب القاع", "في منتصف ارتفاع الماء", "قرب السطح"], "a": 1, "do": "في تبويب «نظرية تورشيللي» حرّك y مع ثبات H وراقب x.", "e": "<span class=\"eq\" dir=\"ltr\">x = 2√(y(H − y))</span> أكبر ما يمكن عند <span class=\"eq\" dir=\"ltr\">y = H/2</span>."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t3:'2) Predict & try',t2:'3) Post-lab discussion',hpoe:'During the lab: predict first, try it in the lab, then read the explanation.',s1:'① Predict',s2:'② Try it in the lab',s3:'③ Explain',see:'I tried it, show explanation',hit:'Your prediction was right.',miss:'Your prediction differs from the result, which is useful: see why.',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};
const $=id=>document.getElementById(id);
$('badge').innerHTML=D.course+' · <bdi dir="ltr">'+D.code+'</bdi>';$('h1').innerHTML=D.title;
$('t1').textContent=T.t1;$('t2').textContent=T.t2;$('t3').textContent=T.t3;$('h_poe').textContent=T.hpoe;$('h_pre').textContent=T.hpre;$('h_post').textContent=T.hpost;
['pp','dp','ep'].forEach(i=>$(i).textContent=T.prev);['pn','dn','en'].forEach(i=>$(i).textContent=T.next);
let pi=0,st=D.pre.map(()=>-1),di=0,shown=D.post.map(()=>false),txt=D.post.map(()=>'');
function dots(el,n,k){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i===k)d.className='on';el.appendChild(d);}}
function rPre(){const c=$('pc');const N=D.pre.length;
if(pi===N){const s=st.filter((v,i)=>v===D.pre[i].a).length;c.innerHTML='<div class="score"><div>'+T.res+'</div><div class="big">'+s+' / '+N+'</div><p>'+(s>=N-1?T.good:(s>=Math.ceil(N/2)?T.mid:T.low+D.review))+'</p><button class="show" id="rt">'+T.again+'</button></div>';$('rt').onclick=()=>{st=st.map(()=>-1);pi=0;rPre();};}
else{const it=D.pre[pi];c.innerHTML='<div class="qn">'+T.q+' '+(pi+1)+' '+T.of+' '+N+'</div><div class="q">'+it.q+'</div>';
it.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;
if(st[pi]>=0){b.disabled=true;if(j===it.a)b.classList.add('right');else if(j===st[pi])b.classList.add('wrong');}
b.onclick=()=>{st[pi]=j;rPre();};c.appendChild(b);});
if(st[pi]>=0){const f=document.createElement('div');f.className='fb';f.innerHTML='<b>'+(st[pi]===it.a?T.ok:T.no)+'</b> '+it.e;c.appendChild(f);}}
dots($('pd'),N+1,pi);$('pp').disabled=pi===0;$('pn').disabled=pi===N||(pi<N&&st[pi]<0);}
function rPost(){const c=$('dc');const N=D.post.length;const it=D.post[di];
c.innerHTML='<div class="qn">'+T.q+' '+(di+1)+' '+T.of+' '+N+'<span class="tag">'+it.t+'</span></div><div class="q">'+it.q+'</div><textarea placeholder="'+T.ph+'"></textarea><button class="show">'+(shown[di]?T.hide:T.show)+'</button><div class="ans'+(shown[di]?' on':'')+'">'+it.a+'</div>';
const ta=c.querySelector('textarea');ta.value=txt[di];ta.oninput=()=>txt[di]=ta.value;
c.querySelector('.show').onclick=()=>{shown[di]=!shown[di];rPost();};
dots($('dd'),N,di);$('dp').disabled=di===0;$('dn').disabled=di===N-1;}
$('pp').onclick=()=>{pi--;rPre();};$('pn').onclick=()=>{pi++;rPre();};$('dp').onclick=()=>{di--;rPost();};$('dn').onclick=()=>{di++;rPost();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));});
let ei=0,ech=D.poe.map(()=>-1),eopen=D.poe.map(()=>false);
function rPoe(){const c=$('ec');const N=D.poe.length;const it=D.poe[ei];
 c.innerHTML='<div class="qn">'+T.q+' '+(ei+1)+' '+T.of+' '+N+'<span class="tag">'+it.t+'</span></div><div class="step">'+T.s1+'</div><div class="q">'+it.q+'</div>';
 it.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;
  if(ech[ei]>=0){b.disabled=true;if(eopen[ei]&&j===it.a)b.classList.add('right');else if(j===ech[ei])b.classList.add(eopen[ei]&&j!==it.a?'wrong':'right');if(!eopen[ei]&&j===ech[ei]){b.classList.remove('right');b.style.borderColor='var(--acc2)';}}
  b.onclick=()=>{ech[ei]=j;rPoe();};c.appendChild(b);});
 if(ech[ei]>=0){const d=document.createElement('div');d.innerHTML='<div class="step">'+T.s2+'</div><div class="do">'+it.do+'</div>'+(eopen[ei]?'<div class="step">'+T.s3+'</div><div class="fb"><span class="verdict">'+(ech[ei]===it.a?T.hit:T.miss)+'</span> '+it.e+'</div>':'<button class="show" id="see">'+T.see+'</button>');c.appendChild(d);
  const s=c.querySelector('#see');if(s)s.onclick=()=>{eopen[ei]=true;rPoe();};}
 dots($('ed'),N,ei);$('ep').disabled=ei===0;$('en').disabled=ei===N-1;}
$('ep').onclick=()=>{ei--;rPoe();};$('en').onclick=()=>{ei++;rPoe();};
rPre();rPost();rPoe();
</script>
<script>(function(){document.documentElement.classList.add("vl-solo");function s(){try{parent.postMessage({__vlh:Math.ceil(document.body.getBoundingClientRect().height+24),id:"f1"},"*")}catch(e){}}addEventListener("load",s);addEventListener("click",function(){setTimeout(s,50);setTimeout(s,400)},true);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body||document.documentElement);setInterval(s,1200);s();})()</script><script>(function(){var p=(location.hash||"#pre").slice(1);
var b=document.querySelector('.tabs button[data-p="'+p+'"]');if(b)b.click();
["nav.tabs",".top","#h1"].forEach(function(s){var e=document.querySelector(s);if(e)e.style.display="none";});
document.documentElement.style.background=document.body.style.background="transparent";})();</script>
</body>
</html>
