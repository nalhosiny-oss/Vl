<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قبل المعمل وبعده: الفصل الثاني – النماذج الذرية وطيف الهيدروجين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=STIX+Two+Text&display=swap">
<style>
:root{--bg:#FBF8F1;--panel:#FFFFFF;--ink:#2A2623;--muted:#6F6553;--line:#E2DACB;--acc:#2A2623;--onacc:#fff;--acc2:#8C6414;--chip:#F4EEE2;--ok:#1E8E5A;--okbg:#E3F5EC;--bad:#C63A3A;--badbg:#FBE6E6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:1px 12px;font-size:.8rem}
h1{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:.3em 0 0}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pane{display:none}.pane.on{display:block}
.hint{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:300px}
.qn{font-size:.82rem;color:var(--acc2);font-weight:700}
.tag{display:inline-block;font-size:.78rem;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-inline-start:6px}
.q{margin:4px 0 8px;font-size:1rem;font-weight:700}
.opt{display:block;width:100%;text-align:start;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer;min-height:42px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:6px;font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}
.eq{font-family:'STIX Two Text',serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
textarea{width:100%;min-height:76px;font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.show{font:inherit;margin-top:6px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);padding:6px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.ans{display:none;margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ans.on{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:2rem;color:var(--acc2);font-weight:700}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.step{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.do{margin-top:8px;background:var(--chip);border-inline-start:3px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:.93rem}
.verdict{font-weight:700}
.tabs button{font-size:clamp(.8rem,2.6vw,1rem);padding:8px 6px}
</style>
</head>

<section class="pane on" id="pre"><p class="hint" id="h_pre"></p><div class="card" id="pc"></div><div class="nav"><button id="pp"></button><div class="dots" id="pd"></div><button id="pn"></button></div></section>
<section class="pane" id="poe"><p class="hint" id="h_poe"></p><div class="card" id="ec"></div><div class="nav"><button id="ep"></button><div class="dots" id="ed"></div><button id="en"></button></div></section>
<section class="pane" id="post"><p class="hint" id="h_post"></p><div class="card" id="dc"></div><div class="nav"><button id="dp"></button><div class="dots" id="dd"></div><button id="dn"></button></div></section>

<script>
const D={"lang":"ar","course":"الأطياف الذرية والجزيئية","code":"2037003-4","title":"قبل المعمل وبعده: <span>الفصل الثاني – النماذج الذرية وطيف الهيدروجين</span>","review":"محاضرة الفصل الثاني: نماذج طومسون ورذرفورد وبور، ومتسلسلات طيف الهيدروجين.","pre":[{"q":"في تجربة رذرفورد ارتد عدد قليل جدًا من جسيمات ألفا بزوايا كبيرة. ماذا استنتج رذرفورد؟","o":["الذرة مصمتة","الشحنة الموجبة وكتلة الذرة مركّزتان في نواة صغيرة","الإلكترونات ثقيلة","جسيمات ألفا سالبة الشحنة"],"a":1,"e":"لا يرتد جسيم ألفا إلا إذا اقترب كثيرًا من شحنة موجبة كبيرة مركّزة، ومعظم الذرة فراغ فتمر أغلب الجسيمات دون انحراف يذكر."},{"q":"نصف قطر مدار بور الثالث لذرة الهيدروجين يساوي:","o":["<span class=\"eq\" dir=\"ltr\">3a₀</span>","<span class=\"eq\" dir=\"ltr\">6a₀</span>","<span class=\"eq\" dir=\"ltr\">9a₀</span>","<span class=\"eq\" dir=\"ltr\">a₀/9</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">r<sub>n</sub> = a₀n²</span>، فعند n = 3 يكون <span class=\"eq\" dir=\"ltr\">9a₀ ≈ 0.48 nm</span>."},{"q":"طاقة المستوى n = 2 في ذرة الهيدروجين تساوي:","o":["<span class=\"eq\" dir=\"ltr\">−13.6 eV</span>","<span class=\"eq\" dir=\"ltr\">−6.8 eV</span>","<span class=\"eq\" dir=\"ltr\">−3.4 eV</span>","<span class=\"eq\" dir=\"ltr\">−1.51 eV</span>"],"a":2,"e":"<span class=\"eq\" dir=\"ltr\">E<sub>n</sub> = −13.6/n² = −13.6/4 = −3.4 eV</span>."},{"q":"خطوط متسلسلة بالمر تنتج من انتقالات الإلكترون إلى المستوى:","o":["<span class=\"eq\" dir=\"ltr\">n = 1</span>","<span class=\"eq\" dir=\"ltr\">n = 2</span>","<span class=\"eq\" dir=\"ltr\">n = 3</span>","<span class=\"eq\" dir=\"ltr\">n = ∞</span>"],"a":1,"e":"متسلسلة بالمر تنتهي عند n = 2، وخطوطها الأولى في المنطقة المرئية."},{"q":"أقل طاقة فوتون تكفي لتأين ذرة هيدروجين في حالتها الأرضية:","o":["<span class=\"eq\" dir=\"ltr\">3.4 eV</span>","<span class=\"eq\" dir=\"ltr\">10.2 eV</span>","<span class=\"eq\" dir=\"ltr\">13.6 eV</span>","<span class=\"eq\" dir=\"ltr\">27.2 eV</span>"],"a":2,"e":"طاقة التأين من المستوى الأرضي تساوي <span class=\"eq\" dir=\"ltr\">13.6 eV</span>."},{"q":"أي مما يلي لا يستطيع نموذج بور تفسيره؟","o":["طيف ذرة الهيدروجين الخطي","طاقة تأين الهيدروجين","طيف ذرة الهيليوم","طيف أيون He⁺"],"a":2,"e":"نموذج بور يصلح للأنظمة ذات الإلكترون الواحد (H وHe⁺ وLi²⁺)، ويفشل مع ذرة الهيليوم ذات الإلكترونين."}],"post":[{"t":"التجربة 1: رذرفورد","q":"كم جسيمًا ارتد بزاوية أكبر من 90° في نموذج طومسون مقارنةً بنموذج رذرفورد؟ وكيف يتغير عدد الجسيمات المرتدة عند زيادة طاقة ألفا؟","a":"في نموذج طومسون لا يرتد أي جسيم، لأن الشحنة الموزعة على حجم الذرة لا تولد قوة كافية. وفي نموذج رذرفورد يرتد عدد قليل. وعند زيادة الطاقة تصغر مسافة أقرب اقتراب <span class=\"eq\" dir=\"ltr\">d ∝ 1/K</span>، فيقل عدد الجسيمات المرتدة بزوايا كبيرة."},{"t":"التجربة 2: نموذج بور","q":"قارن نصف قطر المدار الأول وطاقته في H وفي He⁺. فسّر النتيجة.","a":"في He⁺ تكون Z = 2، فيصغر نصف القطر إلى النصف <span class=\"eq\" dir=\"ltr\">(a₀/Z)</span> وتصبح الطاقة أربعة أمثال: <span class=\"eq\" dir=\"ltr\">−54.4 eV</span>، لأن جذب النواة أقوى بمرتين."},{"t":"التجربة 3: متسلسلات الهيدروجين","q":"احسب الطول الموجي لخط Hα (من n = 3 إلى n = 2) ولحد متسلسلة بالمر، وفسّر تقارب الخطوط عند حد المتسلسلة.","a":"<span class=\"eq\" dir=\"ltr\">1/λ = R<sub>H</sub>(1/4 − 1/9)</span> ⇒ <span class=\"eq\" dir=\"ltr\">λ ≈ 656.5 nm</span>، وحد المتسلسلة <span class=\"eq\" dir=\"ltr\">λ = 4/R<sub>H</sub> ≈ 364.7 nm</span>. تتقارب الخطوط لأن المستويات العليا تتقارب كثيرًا كلما زاد n (الطاقة تتناسب مع 1/n²)."},{"t":"التجربة 4: الامتصاص والتأين","q":"لماذا تمتص الذرة الفوتون 10.2 eV ولا تمتص 11.0 eV، بينما تمتص أي طاقة أكبر من 13.6 eV؟","a":"الامتصاص بين حالتين مقيدتين يحدث فقط إذا ساوت طاقة الفوتون فرقًا بين مستويين، و10.2 eV تساوي الفرق بين n = 1 وn = 2، أما 11.0 eV فلا تساوي أي فرق. وفوق 13.6 eV يصبح الإلكترون حرًا وطاقة حالاته الحرة متصلة، فيُمتص أي فوتون وتتحول الزيادة إلى طاقة حركية."},{"t":"التجربة 5: حدود نموذج بور","q":"ما الذي ظهر في خط Hα عند القدرة التحليلية العالية والحرارة المنخفضة؟ ولماذا فشل بور في حساب طاقة الهيليوم؟","a":"ظهر الخط مركّبتين متقاربتين (تركيب دقيق) لا يتنبأ بهما النموذج، وسببه مغزل الإلكترون والتأثيرات النسبية. وفي الهيليوم يهمل النموذج التنافر بين الإلكترونين، فيعطي <span class=\"eq\" dir=\"ltr\">−108.8 eV</span> بدل القيمة المقيسة <span class=\"eq\" dir=\"ltr\">−79.0 eV</span>."}],"poe":[{"t":"التجربة 1: تجربة رذرفورد","q":"بنموذج طومسون، نسبة جسيمات ألفا التي ترتد بزوايا أكبر من <span class=\"eq\" dir=\"ltr\">90°</span>:","o":["نحو النصف","لا تكاد توجد","نحو 10%","كلها"],"a":1,"do":"في تبويب «تجربة رذرفورد» اختر نموذج طومسون وأطلق 500 جسيم، ثم كرّر بنموذج رذرفورد وقارن.","e":"في نموذج طومسون الشحنة الموجبة موزعة على الذرة كلها، فالمجال ضعيف ولا يحرف ألفا إلا قليلًا. ارتداد جسيمات قليلة بزوايا كبيرة يتطلب شحنة مركّزة في نواة صغيرة جدًا."},{"t":"التجربة 2: نموذج بور","q":"في المدار <span class=\"eq\" dir=\"ltr\">n = 3</span> لذرة الهيدروجين، عدد أطوال موجة دي برولي حول المدار:","o":["1","3","9","6"],"a":1,"do":"في تبويب «نموذج بور» اختر الهيدروجين واجعل <span class=\"eq\" dir=\"ltr\">n = 3</span>، وعُدّ الأطوال الموجية حول المدار.","e":"شرط بور <span class=\"eq\" dir=\"ltr\">mvr = nħ</span> يكافئ <span class=\"eq\" dir=\"ltr\">2πr = nλ</span>: موجة واقفة تنغلق على نفسها بعدد صحيح من الأطوال الموجية. ونصف قطر المدار يتناسب مع <span class=\"eq\" dir=\"ltr\">n<sup>2</sup></span>."},{"t":"التجربة 3: متسلسلات الهيدروجين","q":"الخط الأول في متسلسلة بالمر (<span class=\"eq\" dir=\"ltr\">n<sub>i</sub> = 3 → 2</span>) طوله الموجي:","o":["<span class=\"eq\" dir=\"ltr\">656 nm</span>","<span class=\"eq\" dir=\"ltr\">486 nm</span>","<span class=\"eq\" dir=\"ltr\">122 nm</span>","<span class=\"eq\" dir=\"ltr\">1875 nm</span>"],"a":0,"do":"في تبويب «متسلسلات الهيدروجين» اختر بالمر واجعل <span class=\"eq\" dir=\"ltr\">n<sub>i</sub> = 3</span>، ثم زد <span class=\"eq\" dir=\"ltr\">n<sub>i</sub></span> وراقب تقارب الخطوط.","e":"<span class=\"eq\" dir=\"ltr\">1/λ = R<sub>H</sub>(1/4 − 1/9)</span> يعطي <span class=\"eq\" dir=\"ltr\">656 nm</span> (الخط الأحمر Hα). الفرق بين المستويات العليا يصغر كلما زاد <span class=\"eq\" dir=\"ltr\">n</span>، فتتقارب الخطوط نحو حد المتسلسلة <span class=\"eq\" dir=\"ltr\">365 nm</span>."},{"t":"التجربة 4: الامتصاص والتأين","q":"فوتون طاقته <span class=\"eq\" dir=\"ltr\">16 eV</span> يسقط على ذرة هيدروجين في المستوى الأرضي. النتيجة:","o":["لا يُمتص لأنه لا يطابق فرق مستويين","تتأين الذرة ويخرج الإلكترون بطاقة حركة نحو <span class=\"eq\" dir=\"ltr\">2.4 eV</span>","تُثار الذرة إلى <span class=\"eq\" dir=\"ltr\">n = 2</span> فقط","يُمتص نصفه"],"a":1,"do":"في تبويب «الامتصاص والتأين» اختر المستوى الأرضي، وجرّب <span class=\"eq\" dir=\"ltr\">11.0 eV</span> ثم <span class=\"eq\" dir=\"ltr\">13.6 eV</span> ثم <span class=\"eq\" dir=\"ltr\">16 eV</span>.","e":"تحت <span class=\"eq\" dir=\"ltr\">13.6 eV</span> لا يُمتص إلا فوتون يطابق فرق مستويين تمامًا (<span class=\"eq\" dir=\"ltr\">10.2</span> أو <span class=\"eq\" dir=\"ltr\">12.09 eV</span>...)، فـ <span class=\"eq\" dir=\"ltr\">11.0 eV</span> لا يُمتص. فوق طاقة التأين تكون حالات الإلكترون الحر متصلة، فيُمتص أي فوتون ويحمل الفائض <span class=\"eq\" dir=\"ltr\">16 − 13.6 = 2.4 eV</span>."},{"t":"التجربة 5: حدود نموذج بور","q":"إذا رفعت القدرة التحليلية إلى أقصاها وبرّدت الغاز، فإن خط <span class=\"eq\" dir=\"ltr\">H<sub>α</sub></span> يظهر:","o":["خطًا واحدًا أرفع فقط","مركّبتين متقاربتين أو أكثر","يختفي","ينتقل إلى الأزرق"],"a":1,"do":"في تبويب «حدود نموذج بور» اختر «خط Hα بدقة عالية»، وارفع القدرة التحليلية وخفّض درجة الحرارة.","e":"التبريد يقلل اتساع دوبلر، والقدرة العالية تكشف التركيب الدقيق: مركّبات منفصلة بنحو <span class=\"eq\" dir=\"ltr\">0.016 nm</span> ناتجة عن المغزل والنسبية، وهي ما لا يتنبأ به نموذج بور."}]};
const T=D.lang==='ar'?{t1:'١) اختبار قبلي',t3:'٢) توقّع ثم جرّب',t2:'٣) مناقشة بعد المعمل',hpoe:'أثناء المعمل: توقّع النتيجة أولًا، ثم جرّبها في المعمل، ثم اقرأ التفسير.',s1:'① توقّع',s2:'② جرّب في المعمل',s3:'③ فسّر',see:'جرّبت، أظهر التفسير',hit:'توقّعك صحيح.',miss:'توقّعك يخالف النتيجة، وهذا مفيد: لاحظ السبب.',hpre:'أجب قبل فتح المعمل؛ يظهر التصحيح فور اختيارك، ولا تُحفظ النتيجة ولا تُرسل لأحد.',hpost:'بعد إنهاء المعمل: اكتب إجابتك أولًا، ثم قارنها بالإجابة النموذجية.',prev:'السابق',next:'التالي',res:'النتيجة',again:'إعادة الاختبار',ok:'إجابة صحيحة.',no:'ليست هذه.',show:'أظهر الإجابة النموذجية',hide:'أخفِ الإجابة',ph:'اكتب إجابتك هنا…',q:'السؤال',of:'من',good:'أنت مستعد للمعمل، افتحه الآن.',mid:'جيد، راجع ما أخطأت فيه ثم ابدأ المعمل.',low:'راجع المحاضرة قبل أن تبدأ المعمل: '}:{t1:'1) Pre-lab quiz',t3:'2) Predict & try',t2:'3) Post-lab discussion',hpoe:'During the lab: predict first, try it in the lab, then read the explanation.',s1:'① Predict',s2:'② Try it in the lab',s3:'③ Explain',see:'I tried it, show explanation',hit:'Your prediction was right.',miss:'Your prediction differs from the result, which is useful: see why.',hpre:'Answer before opening the lab. Feedback appears instantly; nothing is saved or sent.',hpost:'After the lab: write your own answer first, then compare it with the model answer.',prev:'Previous',next:'Next',res:'Result',again:'Retake quiz',ok:'Correct.',no:'Not quite.',show:'Show model answer',hide:'Hide answer',ph:'Write your answer here…',q:'Question',of:'of',good:'You are ready, open the lab now.',mid:'Good. Review what you missed, then start the lab.',low:'Review the lecture before starting the lab: '};
const $=id=>document.getElementById(id);
$('badge').innerHTML=D.course+' · <bdi dir="ltr">'+D.code+'</bdi>';$('h1').innerHTML=D.title;
$('t1').textContent=T.t1;$('t2').textContent=T.t2;$('t3').textContent=T.t3;$('h_poe').textContent=T.hpoe;$('h_pre').textContent=T.hpre;$('h_post').textContent=T.hpost;
['pp','dp','ep'].forEach(i=>$(i).textContent=T.prev);['pn','dn','en'].forEach(i=>$(i).textContent=T.next);
let pi=0,st=D.pre.map(()=>-1),di=0,shown=D.post.map(()=>false),txt=D.post.map(()=>'');
function dots(el,n,k){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i===k)d.className='on';el.appendChild(d);}}
function rPre(){const c=$('pc');const N=D.pre.length;
 if(pi===N){const s=st.filter((v,i)=>v===D.pre[i].a).length;c.innerHTML='<div class="score"><div>'+T.res+'</div><div class="big">'+s+' / '+N+'</div><p>'+(s>=N-1?T.good:(s>=Math.ceil(N/2)?T.mid:T.low+D.review))+'</p><button class="show" id="rt">'+T.again+'</button></div>';$('rt').onclick=()=>{st=st.map(()=>-1);pi=0;rPre();};}
 else{const it=D.pre[pi];c.innerHTML='<div class="qn">'+T.q+' '+(pi+1)+' '+T.of+' '+N+'</div><div class="q">'+it.q+'</div>';
  it.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;
   if(st[pi]>=0){b.disabled=true;if(j===it.a)b.classList.add('right');else if(j===st[pi])b.classList.add('wrong');}
   b.onclick=()=>{st[pi]=j;rPre();};c.appendChild(b);});
  if(st[pi]>=0){const f=document.createElement('div');f.className='fb';f.innerHTML='<b>'+(st[pi]===it.a?T.ok:T.no)+'</b> '+it.e;c.appendChild(f);}}
